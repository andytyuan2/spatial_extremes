[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spatial-extremes"
version = "0.1.0"
description = "Tools for simulating and fitting max-stable spatial extreme-value models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andy Yuan" }]
keywords = ["spatial-extremes", "extreme-value-theory", "max-stable-process", "gev", "geostatistics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: GIS",
]
urls = { Homepage = "https://github.com/andytyuan2/spatial_extremes", Repository = "https://github.com/andytyuan2/spatial_extremes" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "shapely>=2.0"]
polars = ["polars>=0.20"]
neural = ["joblib>=1.3", "scikit-learn>=1.3"]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "build",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spatial_extremes"]
