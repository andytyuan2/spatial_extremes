name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/spatial-extremes
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[geo,pandas,neural,plotting,maps,dev]"
      - run: pytest
      - name: Verify release tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag} must match v{version}")
          PY
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
